<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#F8FAFC"/>
  <text x="64" y="72" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#0F172A">Minova Logo vs Current UI Colors</text>
  <text x="64" y="112" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">Logo colors are sampled from logo.png / logo-horizontal.png. UI colors are currently defined in index.html.</text>

  <text x="64" y="172" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#0F172A">Purple</text>
  <rect x="64" y="200" width="500" height="170" rx="16" fill="#6D41A5"/>
  <text x="92" y="255" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Logo Purple</text>
  <text x="92" y="292" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF">#6D41A5</text>
  <text x="92" y="330" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#F5F3FF">Brighter, more vivid, slightly blue-violet</text>

  <rect x="636" y="200" width="500" height="170" rx="16" fill="#582C83"/>
  <text x="664" y="255" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF">Current UI Purple</text>
  <text x="664" y="292" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF">#582C83</text>
  <text x="664" y="330" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#F5F3FF">Darker, more subdued, stronger deep-purple feel</text>

  <line x1="584" y1="218" x2="616" y2="218" stroke="#94A3B8" stroke-width="3"/>
  <line x1="584" y1="352" x2="616" y2="352" stroke="#94A3B8" stroke-width="3"/>
  <path d="M600 218 L600 352" stroke="#94A3B8" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="600" y="395" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#64748B">Logo purple is visibly lighter and more saturated</text>

  <text x="64" y="458" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#0F172A">Yellow</text>
  <rect x="64" y="486" width="500" height="170" rx="16" fill="#FCBD1A"/>
  <text x="92" y="541" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#2A1A4F">Logo Yellow</text>
  <text x="92" y="578" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="900" fill="#2A1A4F">#FCBD1A</text>
  <text x="92" y="616" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#2A1A4F">Warmer, slightly more orange-gold</text>

  <rect x="636" y="486" width="500" height="170" rx="16" fill="#FFC107"/>
  <text x="664" y="541" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800" fill="#2A1A4F">Current UI Yellow</text>
  <text x="664" y="578" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="900" fill="#2A1A4F">#FFC107</text>
  <text x="664" y="616" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#2A1A4F">A little brighter, closer to standard amber</text>

  <line x1="584" y1="504" x2="616" y2="504" stroke="#94A3B8" stroke-width="3"/>
  <line x1="584" y1="638" x2="616" y2="638" stroke="#94A3B8" stroke-width="3"/>
  <path d="M600 504 L600 638" stroke="#94A3B8" stroke-width="3" stroke-dasharray="8 8"/>
  <text x="600" y="681" font-family="Arial, Helvetica, sans-serif" font-size="16" text-anchor="middle" fill="#64748B">Yellow difference is subtle; purple difference is much stronger</text>
</svg>
